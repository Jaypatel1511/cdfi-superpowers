name: Refresh package versions

# Three jobs.
#
# refresh — keeps the version numbers in docs/index.html matching what is
# actually live on PyPI. Runs every morning, and on demand from the Actions tab.
# It rewrites docs/index.html and NOTHING ELSE — see version-claims-gate.
#
# version-claims-gate — asserts every version this repo STATES agrees with live
# PyPI (scripts/check_package_versions.py). It exists because `refresh` covered
# only one of the four surfaces that state versions, so docs/index.html stayed
# nearly right while references/package-index.md — the machine-readable package
# reference an agent loading this plugin actually reads — drifted to ten wrong
# rows out of twenty-two, three of them pointing at releases YANKED for
# presenting fabricated or sample data as federal data. A stale chip is
# cosmetic; that is not.
#
# It is a GATE, not a second rewriter, deliberately. The version cell in
# package-index.md carries install floors and resolution notes, and a floor is a
# load-bearing judgment (README.md argues at length that the cdfi-benchmark
# floor is deliberately NOT the newest release). Mechanically bumping floors
# would erase that reasoning; a regex cannot tell a floor that should move from
# one that must not. So the file is checked and a disagreement fails loudly.
# Expect this to go red on main when a package publishes: that red IS the
# notification, and the fix is a one-line edit to the row.
#
# vocabulary-gate — asserts every document that describes nmtc-mapper's
# eligibility_status vocabulary agrees with the INSTALLED package
# (scripts/check_status_vocabulary.py). Runs on the same schedule, on demand,
# and on every push and pull request, so drift is caught before merge and
# again each morning. The nmtc-mapper version is PINNED below: a failure on an
# unchanged pin means the documents drifted; when a new release changes the
# vocabulary, bumping the pin is what turns that release into a failing run —
# the notification this gate exists to produce. Three nmtc-mapper releases
# silently falsified this plugin's prose before it existed (CHANGELOG 2026.9.1).

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 America/Chicago (CDT) / 05:17 (CST)
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

env:
  # The nmtc-mapper release the vocabulary gate certifies the documents against.
  # Bump deliberately, after re-reading the skill against the new release.
  NMTC_MAPPER_PIN: "0.6.1"

jobs:
  vocabulary-gate:
    # Deliberately NOT pinned to ubuntu-24.04. `ubuntu-latest` moves to Ubuntu 26
    # on 2026-10-19; the break that causes elsewhere is actions/setup-python, which
    # has no Python 3.9 build for ubuntu-26.04. No job in this repo asks for 3.9 —
    # `vocabulary-gate` pins 3.12 (which has a 26.04 build) and `refresh` runs no
    # setup-python at all — so this repo has no exposure and needs no pin.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned nmtc-mapper
        run: python3 -m pip install --quiet "nmtc-mapper==${NMTC_MAPPER_PIN}"

      - name: Check every document against the installed vocabulary
        run: python3 scripts/check_status_vocabulary.py

  version-claims-gate:
    # Same triggers as vocabulary-gate: before merge, and again each morning.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reads PyPI over HTTPS with the standard library only — nothing to
      # install, so a PyPI outage cannot make this job pass by accident. A
      # lookup failure is a hard failure inside the script.
      - name: Check every stated version against live PyPI
        run: python3 scripts/check_package_versions.py

  refresh:
    # The version refresh commits to main; it must not run on pushes or PRs,
    # only on the schedule and on demand, exactly as before the gate was added.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # Deliberately NOT pinned to ubuntu-24.04. `ubuntu-latest` moves to Ubuntu 26
    # on 2026-10-19; the break that causes elsewhere is actions/setup-python, which
    # has no Python 3.9 build for ubuntu-26.04. No job in this repo asks for 3.9 —
    # `vocabulary-gate` pins 3.12 (which has a 26.04 build) and `refresh` runs no
    # setup-python at all — so this repo has no exposure and needs no pin.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite version numbers from PyPI
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          PAGE = "docs/index.html"
          html = open(PAGE, encoding="utf-8").read()

          # Matches:  <a class="pkg-name" href=".../project/SLUG/">NAME</a><span class="pkg-ver">VERSION</span>
          #
          # EVERY group here is NAMED, and the replacement refers to them by name.
          # It did not, once, and the numbering was not what it looked like: `slug`
          # is nested INSIDE the opening group, so it took number 2, `ver` took 3 and
          # `</span>` took 4. `m.group(1) + new + m.group(3)` therefore emitted
          # prefix + NEW + OLD and dropped the closing tag, rewriting every chip on
          # the page as `0.2.10.2.0</div>` on 2026-09-10. Never index these by number.
          PATTERN = re.compile(
              r'(?P<prefix>href="https://pypi\.org/project/(?P<slug>[^/"]+)/"[^>]*>'
              r'[^<]+</a><span class="pkg-ver">)(?P<ver>[^<]+)(?P<suffix></span>)'
          )

          # How many chips the page actually has, counted WITHOUT the pattern above.
          # This is the guard that was missing: once the corruption dropped `</span>`,
          # PATTERN stopped matching those lines, and every run afterwards reported
          # "No change - every version on the page matches PyPI" while the page it
          # maintains was broken. A refresh that silently matches nothing must fail.
          CHIP_COUNT = len(re.findall(r'<span class="pkg-ver">', html))

          changes, failures = [], []

          def current(slug):
              url = f"https://pypi.org/pypi/{slug}/json"
              req = urllib.request.Request(url, headers={"User-Agent": "cdfi-superpowers-version-refresh"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["info"]["version"]

          def swap(m):
              slug, old = m.group("slug"), m.group("ver")
              try:
                  new = current(slug)
              except Exception as e:
                  failures.append(f"{slug}: {e}")
                  return m.group(0)
              if new != old:
                  changes.append(f"{slug}: {old} -> {new}")
              return m.group("prefix") + new + m.group("suffix")

          out, matched = PATTERN.subn(swap, html)

          # Two structural gates, both of which this script failed silently once.
          if matched != CHIP_COUNT:
              print(f"REFUSING: the page has {CHIP_COUNT} version chips but the "
                    f"pattern matched {matched}. The page markup and this script "
                    f"disagree; a partial rewrite is worse than none.")
              sys.exit(1)

          if re.search(r'<span class="pkg-ver">[^<]*</div>', out):
              print("REFUSING: a version chip would be written without its "
                    "closing </span>.")
              sys.exit(1)

          # A network failure must never silently blank a version or commit a partial
          # refresh. If any lookup failed, write nothing and fail the run loudly.
          if failures:
              print("FAILED lookups:\n  " + "\n  ".join(failures))
              sys.exit(1)

          if out != html:
              open(PAGE, "w", encoding="utf-8").write(out)
              print("Updated:\n  " + "\n  ".join(changes))
          else:
              print("No change - every version on the page matches PyPI.")
          PY

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain docs/index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Refresh package versions from PyPI"
            git push
          else
            echo "Nothing to commit."
          fi
