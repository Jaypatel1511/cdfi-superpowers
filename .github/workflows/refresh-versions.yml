name: Refresh package versions

# Keeps the version numbers in docs/index.html matching what is actually live
# on PyPI. Runs every morning, and on demand from the Actions tab.

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 America/Chicago (CDT) / 05:17 (CST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite version numbers from PyPI
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          PAGE = "docs/index.html"
          html = open(PAGE, encoding="utf-8").read()

          # Matches:  <a class="pkg-name" href=".../project/SLUG/">NAME</a><span class="pkg-ver">VERSION</span>
          PATTERN = re.compile(
              r'(href="https://pypi\.org/project/(?P<slug>[^/"]+)/"[^>]*>'
              r'[^<]+</a><span class="pkg-ver">)(?P<ver>[^<]+)(</span>)'
          )

          changes, failures = [], []

          def current(slug):
              url = f"https://pypi.org/pypi/{slug}/json"
              req = urllib.request.Request(url, headers={"User-Agent": "cdfi-superpowers-version-refresh"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["info"]["version"]

          def swap(m):
              slug, old = m.group("slug"), m.group("ver")
              try:
                  new = current(slug)
              except Exception as e:
                  failures.append(f"{slug}: {e}")
                  return m.group(0)
              if new != old:
                  changes.append(f"{slug}: {old} -> {new}")
              return m.group(1) + new + m.group(3)

          out = PATTERN.sub(swap, html)

          # A network failure must never silently blank a version or commit a partial
          # refresh. If any lookup failed, write nothing and fail the run loudly.
          if failures:
              print("FAILED lookups:\n  " + "\n  ".join(failures))
              sys.exit(1)

          if out != html:
              open(PAGE, "w", encoding="utf-8").write(out)
              print("Updated:\n  " + "\n  ".join(changes))
          else:
              print("No change - every version on the page matches PyPI.")
          PY

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain docs/index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Refresh package versions from PyPI"
            git push
          else
            echo "Nothing to commit."
          fi
