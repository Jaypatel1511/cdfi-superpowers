name: Refresh package versions

# Two jobs.
#
# refresh — keeps the version numbers in docs/index.html matching what is
# actually live on PyPI. Runs every morning, and on demand from the Actions tab.
#
# vocabulary-gate — asserts every document that describes nmtc-mapper's
# eligibility_status vocabulary agrees with the INSTALLED package
# (scripts/check_status_vocabulary.py). Runs on the same schedule, on demand,
# and on every push and pull request, so drift is caught before merge and
# again each morning. The nmtc-mapper version is PINNED below: a failure on an
# unchanged pin means the documents drifted; when a new release changes the
# vocabulary, bumping the pin is what turns that release into a failing run —
# the notification this gate exists to produce. Three nmtc-mapper releases
# silently falsified this plugin's prose before it existed (CHANGELOG 2026.9.1).

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 America/Chicago (CDT) / 05:17 (CST)
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: write

env:
  # The nmtc-mapper release the vocabulary gate certifies the documents against.
  # Bump deliberately, after re-reading the skill against the new release.
  NMTC_MAPPER_PIN: "0.6.0"

jobs:
  vocabulary-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned nmtc-mapper
        run: python3 -m pip install --quiet "nmtc-mapper==${NMTC_MAPPER_PIN}"

      - name: Check every document against the installed vocabulary
        run: python3 scripts/check_status_vocabulary.py

  refresh:
    # The version refresh commits to main; it must not run on pushes or PRs,
    # only on the schedule and on demand, exactly as before the gate was added.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite version numbers from PyPI
        run: |
          python3 - <<'PY'
          import json, re, sys, urllib.request

          PAGE = "docs/index.html"
          html = open(PAGE, encoding="utf-8").read()

          # Matches:  <a class="pkg-name" href=".../project/SLUG/">NAME</a><span class="pkg-ver">VERSION</span>
          PATTERN = re.compile(
              r'(href="https://pypi\.org/project/(?P<slug>[^/"]+)/"[^>]*>'
              r'[^<]+</a><span class="pkg-ver">)(?P<ver>[^<]+)(</span>)'
          )

          changes, failures = [], []

          def current(slug):
              url = f"https://pypi.org/pypi/{slug}/json"
              req = urllib.request.Request(url, headers={"User-Agent": "cdfi-superpowers-version-refresh"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)["info"]["version"]

          def swap(m):
              slug, old = m.group("slug"), m.group("ver")
              try:
                  new = current(slug)
              except Exception as e:
                  failures.append(f"{slug}: {e}")
                  return m.group(0)
              if new != old:
                  changes.append(f"{slug}: {old} -> {new}")
              return m.group(1) + new + m.group(3)

          out = PATTERN.sub(swap, html)

          # A network failure must never silently blank a version or commit a partial
          # refresh. If any lookup failed, write nothing and fail the run loudly.
          if failures:
              print("FAILED lookups:\n  " + "\n  ".join(failures))
              sys.exit(1)

          if out != html:
              open(PAGE, "w", encoding="utf-8").write(out)
              print("Updated:\n  " + "\n  ".join(changes))
          else:
              print("No change - every version on the page matches PyPI.")
          PY

      - name: Commit if anything changed
        run: |
          if [ -n "$(git status --porcelain docs/index.html)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/index.html
            git commit -m "Refresh package versions from PyPI"
            git push
          else
            echo "Nothing to commit."
          fi
